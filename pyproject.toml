[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-polish"
description = "B站字幕批量抓取与本地任务队列：单视频 / UP主 / 合集 / 搜索批量导出 txt/srt/json/md，附带中文 ASR 术语订正与质量自评，零第三方依赖"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "angus-hu-gzy" }]
keywords = ["asr", "speech-to-text", "whisper", "术语订正", "转写", "中文", "nlp", "bilibili", "字幕", "subtitle", "mcp", "model-context-protocol", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/angus-hu-gzy/asr-polish"
Repository = "https://github.com/angus-hu-gzy/asr-polish"
Changelog = "https://github.com/angus-hu-gzy/asr-polish/blob/main/CHANGELOG.md"
Issues = "https://github.com/angus-hu-gzy/asr-polish/issues"

[project.optional-dependencies]
bilibili = ["yt-dlp"]
# 开发用：ruff 做静态检查，build 打 sdist/wheel（CI 里跑的就是这些）
dev = ["ruff>=0.6", "build>=1.0"]

[project.scripts]
asr-polish = "asr_polish.cli:main"
# MCP server：让 agent 在对话里直接调「取字幕」，零额外依赖
asr-polish-mcp = "asr_polish.mcp:main"

[tool.setuptools.packages.find]
include = ["asr_polish*"]

[tool.setuptools.package-data]
asr_polish = ["data/*.json", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "asr_polish.__version__" }
