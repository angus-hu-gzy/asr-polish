[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-polish"
description = "中文 ASR 转写质量打磨 + B站字幕抓取：术语订正、多引擎交叉验证、质量自评，批量抓字幕导出 txt/srt/json/md，核心零依赖"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "angus-hu-gzy" }]
keywords = ["asr", "speech-to-text", "whisper", "术语订正", "转写", "中文", "nlp", "bilibili", "字幕", "subtitle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/angus-hu-gzy/asr-polish"
Repository = "https://github.com/angus-hu-gzy/asr-polish"

[project.optional-dependencies]
bilibili = ["yt-dlp"]

[project.scripts]
asr-polish = "asr_polish.cli:main"

[tool.setuptools]
packages = ["asr_polish"]

[tool.setuptools.package-data]
asr_polish = ["data/*.json", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "asr_polish.__version__" }
