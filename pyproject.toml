[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-polish"
description = "中文 ASR 转写质量打磨 + B站视频取文本：术语订正、多引擎交叉验证、转写质量自评、一条命令抓 B站字幕/语音转写，核心零依赖"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "angus-hu-gzy" }]
keywords = ["asr", "speech-to-text", "whisper", "术语订正", "转写", "中文", "nlp", "bilibili", "字幕", "subtitle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/angus-hu-gzy/asr-polish"
Repository = "https://github.com/angus-hu-gzy/asr-polish"

[project.optional-dependencies]
bilibili = ["yt-dlp"]

[project.scripts]
asr-polish = "asr_polish.cli:main"

[tool.setuptools]
packages = ["asr_polish"]

[tool.setuptools.package-data]
asr_polish = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "asr_polish.__version__" }
